name: Build image

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # Same command as go.yml (upstream)
  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go tests
        run: DOCKER_TESTS=1 go test github.com/quickfeed/quickfeed/...

  # Same steps as vitest.yml (upstream)
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26.4.0
          cache: npm
          cache-dependency-path: ./public/package-lock.json
      - name: Install modules
        working-directory: ./public
        run: npm ci
      - name: Run tests
        working-directory: ./public
        run: npm run test:ci

  # Runs only if both test jobs pass. Pushes only on master, not on PRs.
  image:
    needs: [test-go, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/mahdavizeinab/quickfeed:${{ github.sha }}

  # Runs only after the image is pushed, and only on master (not on PRs).
  # Writes the new image tag into deploy/k8s/overlays/test/kustomization.yaml and commits it.
  update-tag:
    needs: [image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two merges close together update the tag one after the other, never at the same time.
    concurrency:
      group: update-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Set the new image tag
        working-directory: deploy/k8s/overlays/test
        run: kustomize edit set image quickfeed=ghcr.io/mahdavizeinab/quickfeed:${{ github.sha }}
      - name: Commit and push the new tag
        run: |
          if git diff --quiet; then
            echo "Tag is already ${{ github.sha }}, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(test): set quickfeed image to ${{ github.sha }} [skip ci]"
          git pull --rebase origin master
          git push origin HEAD:master
