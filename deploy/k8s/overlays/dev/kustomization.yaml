# QuickFeed dev: everything from ../../base, in the namespace quickfeed-dev.
#
# Argo CD watches this folder (see deploy/argocd/quickfeed-dev.yaml).
# The update-tag job in .github/workflows/image.yml sets newTag after every merge to master.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: quickfeed-dev

resources:
  - ../../base

images:
  - name: quickfeed
    newName: ghcr.io/mahdavizeinab/quickfeed
    newTag: dba3210ac9c47bbb925e4b3e6fc8e9ad9f06f695
