apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickfeed
  labels:
    app.kubernetes.io/name: quickfeed
spec:
  # One QuickFeed pod normally (two for a moment during a deploy). The
  # ReadWriteOnce volume (certificates, logs) can only be attached to one node,
  # so both pods must run on the same node (see affinity below).
  replicas: 1
  strategy:
    # Start the new pod before stopping the old one, so QuickFeed stays up during a deploy.
    # The ReadWriteOnce volume works for both pods only on the same node (see affinity below).
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1   # one extra pod may start while the old one still runs
      maxUnavailable: 0 # never stop the old pod before the new one is ready
  selector:
    matchLabels:
      app.kubernetes.io/name: quickfeed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quickfeed
    spec:
      securityContext:
        # The image runs as user 10001 (see Dockerfile). fsGroup makes the
        # volume writable for that user.
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      # Keep the new pod on the same node as the old one during a deploy,
      # because the ReadWriteOnce volume can only attach to one node.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: quickfeed
              topologyKey: kubernetes.io/hostname
      initContainers:
        # Create the log directory on the volume before QuickFeed starts.
        - name: prepare-data
          image: quickfeed
          command: ["sh", "-c", "mkdir -p /data/logs/courses"]
          volumeMounts:
            - name: data
              mountPath: /data
        # Wait until the database accepts connections before starting QuickFeed.
        # "-U postgres" is needed: this pod runs as uid 10001, which has no user
        # name in the postgres image, so pg_isready gives up without it ("no attempt").
        # pg_isready does not log in, so any user name works here.
        - name: wait-for-postgres
          image: postgres:17.6
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U postgres; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: quickfeed
          image: quickfeed
          envFrom:
            # QuickFeed configuration (DOMAIN, QUICKFEED_APP_ID, secrets, ...),
            # see .env-template. Create it with:
            #   kubectl -n quickfeed create secret generic quickfeed-env --from-env-file=.env
            - secretRef:
                name: quickfeed-env
          env:
            # The GitHub App private key is a file from the Secret quickfeed-app-key
            # (see the volume "app-key" below).
            - name: QUICKFEED_APP_KEY
              value: /secrets/app-key.pem
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: postgres, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: postgres, key: POSTGRES_DB }
            # QuickFeed uses the PostgreSQL database at this address.
            # Traffic stays inside the cluster network, so TLS is not used here.
            - name: QUICKFEED_DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable
          ports:
            - name: https
              containerPort: 443
            - name: http
              containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /data
            - name: data
              mountPath: /app/logs
              subPath: logs
            - name: app-key
              mountPath: /secrets
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: quickfeed-data
        - name: app-key
          secret:
            secretName: quickfeed-app-key
            defaultMode: 0440
