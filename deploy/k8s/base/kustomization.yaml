# QuickFeed with its PostgreSQL database: the parts that are the same in dev and prod.
#
# Do not apply this folder directly. Use an overlay, which adds the namespace and the image tag:
#   deploy/k8s/overlays/dev    (Argo CD: deploy/argocd/quickfeed-dev.yaml)
#   deploy/k8s/overlays/prod   (Argo CD: deploy/argocd/quickfeed-prod.yaml)
#
# The Secrets quickfeed-env, quickfeed-app-key and postgres are not in git.
# Create them by hand in each namespace; see deploy/k8s/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - data-pvc.yaml
  - deployment.yaml
  - service.yaml
  - postgres-statefulset.yaml
  - postgres-service.yaml
