# Argo CD Application for QuickFeed test (qf-test.ux.uis.no).
#
# Argo CD watches deploy/k8s/overlays/test on the master branch and deploys it to
# the namespace quickfeed. The update-tag job in .github/workflows/image.yml
# changes the image tag there after every merge.
#
# Sync is manual for now: start each sync by hand in the Argo CD UI or with
#   argocd app sync quickfeed-test
#
# Apply once, after Argo CD is installed in the namespace argocd:
#   kubectl apply -f deploy/argocd/quickfeed-test.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quickfeed-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MahdaviZeinab/quickfeed.git
    targetRevision: master
    path: deploy/k8s/overlays/test
  destination:
    server: https://kubernetes.default.svc
    namespace: quickfeed
