# Argo CD Application for QuickFeed dev.
#
# Argo CD watches deploy/k8s/overlays/dev on the master branch and deploys it to
# the namespace quickfeed-dev. The update-tag job in .github/workflows/image.yml
# changes the image tag there after every merge; Argo CD then rolls out the new image.
#
# Apply once, after Argo CD is installed in the namespace argocd:
#   kubectl apply -f deploy/argocd/quickfeed-dev.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quickfeed-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MahdaviZeinab/quickfeed.git
    targetRevision: master
    path: deploy/k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: quickfeed-dev
  syncPolicy:
    automated:
      prune: true # delete what was removed from git
      selfHeal: true # undo changes made by hand on the cluster
    syncOptions:
      - CreateNamespace=true
